<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar M&A / Levées - Hello Watt</title>
    <!-- Police moderne Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="header">
            <div class="logo-area">
                <h1>Radar Veille <span>Hello Watt</span></h1>
                <p>Suivi des levées de fonds et opérations M&A</p>
            </div>
            
            <div class="controls">
                <select id="time-filter" class="modern-select">
                    <option value="3">Les 3 derniers jours</option>
                    <option value="7">La semaine dernière</option>
                    <option value="30" selected>Le mois dernier</option>
                    <option value="all">Sans limite (Archives)</option>
                </select>
                
                <div class="button-group">
                    <button id="btn-levee" class="btn btn-primary">🚀 Dernières Levées</button>
                    <button id="btn-ma" class="btn btn-secondary">🤝 Opérations M&A</button>
                    <button id="btn-all" class="btn btn-ghost">🔍 Voir tout</button>
                </div>
            </div>
        </header>
        
        <div id="loading" class="loading-state" style="display:none;"></div>
        
        <div class="table-container">
            <table id="results-table">
                <thead>
                    <tr>
                        <th width="10%">Date</th>
                        <th width="12%">Secteur</th>
                        <th width="15%">Entité</th>
                        <th width="13%">Montant</th>
                        <th width="50%">Source & Article</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    <!-- Les données s'affichent ici -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script> 
</body>
</html>
